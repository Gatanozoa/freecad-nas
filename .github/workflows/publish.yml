name: Test and publish FreeCAD images
on:
  push:
    branches: [main]
    paths:
      - 'FreeCAD-Agent-Service/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
      - 'deploy/cad/**'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freecad-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python scripts/check_release.py
      - run: python -m pip install -r FreeCAD-Agent-Service/requirements.txt
      - name: Queue, auth, retention, cleanup and MCP regression tests
        working-directory: FreeCAD-Agent-Service
        run: python -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            target: api
          - component: worker
            target: worker
    steps:
      - uses: actions/checkout@v6
      - name: Set image names and source version
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version=$(python -c "import ast; tree=ast.parse(open('FreeCAD-Agent-Service/cad_service/__init__.py').read()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id=='__version__' for t in n.targets)))")
          echo "name=ghcr.io/${owner}/freecad-agent-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "revision=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Linux amd64 image locally on runner
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: FreeCAD-Agent-Service
          file: FreeCAD-Agent-Service/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: freecad-test:${{ matrix.component }}
          build-args: |
            PYTHON_BASE=docker.io/library/python:3.13-slim-trixie
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Real FreeCAD geometry and export smoke test
        if: matrix.component == 'worker'
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,mode=1777 \
            --tmpfs /artifacts:rw,uid=10001,gid=10001,mode=0700 \
            --mount type=bind,src="$PWD/scripts/worker_smoke.py",dst=/smoke.py,readonly \
            --entrypoint /opt/freecad/usr/bin/python freecad-test:worker /smoke.py
      - name: Gateway import and static resource check
        if: matrix.component == 'gateway'
        run: docker run --rm --network none --read-only --entrypoint python freecad-test:gateway -c "from cad_service.api import create_app; from pathlib import Path; assert Path('cad_service/web/index.html').is_file(); print('Gateway imports and admin assets OK')"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          REVISION: ${{ steps.image.outputs.revision }}
          COMPONENT: ${{ matrix.component }}
        run: |
          for tag in "$VERSION" "$REVISION" latest; do
            docker tag "freecad-test:$COMPONENT" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "### Published $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Source revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
